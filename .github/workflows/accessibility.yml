name: Accessibility

on:
  push:
    branches: [feat/a11y-core-0.1.1-rc.2]
    tags: ['dsh-v*-a11y.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'
  NODE_VERSION: '22.19.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gui:
    name: GUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Run GUI regressions
        run: pnpm run test:gui

  production:
    name: Production build and browser replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build official distribution
        run: pnpm run build:official

      - name: Install Playwright Chromium
        run: pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium

      - name: Install sandbox backend
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap

      - name: Replay browser snapshots
        env:
          DSH_SNAPSHOT: replay
        run: >-
          pnpm exec vitest run --config vitest.web.config.ts
          --exclude apps/web/tests/hmr-live.e2e.ts

  accessibility:
    name: Accessibility gate
    if: always()
    needs: [gui, production]
    runs-on: ubuntu-latest
    steps:
      - name: Require every accessibility job
        env:
          GUI_RESULT: ${{ needs.gui.result }}
          PRODUCTION_RESULT: ${{ needs.production.result }}
        run: test "$GUI_RESULT" = success && test "$PRODUCTION_RESULT" = success
